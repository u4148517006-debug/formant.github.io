<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人力音声合成・右手母音トリガーボード</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1e1e24; 
            color: #fff;
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; 
        }

        .app-container {
            display: grid;
            grid-template-columns: 35% 65%; 
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* 左側：母音エリア */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            padding: 12px 10px;
            box-sizing: border-box;
            border-right: 2px solid #2a2a35;
            background: #15151a;
            gap: 15px;
        }

        .system-btn {
            width: 95%;
            padding: 10px;
            font-size: 11px;
            font-weight: bold;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .system-btn.playing { background: #dc3545; }
        .system-btn:disabled { background: #555; cursor: not-allowed; }

        .pad-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 240px; 
        }
        #vowelPad {
            background: #22222b;
            border: 2px solid #444;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* 右側：子音ボードエリア */
        .right-panel-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            height: 100%;
            background: #1e1e24;
            box-sizing: border-box;
            padding-top: 5px; 
        }

        .right-panel {
            display: grid;
            grid-template-rows: repeat(3, 1fr); 
            gap: 8px;
            padding: 0 12px;
            height: 80%; 
            box-sizing: border-box;
        }

        .button-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px;
        }

        .consonant-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            transition: background 0.05s;
        }
        
        .playable-key { border: 1px solid #00ffcc !important; }
        .btn-index { border-bottom: 4px solid #00cc00; } 
        .btn-middle { border-bottom: 4px solid #d4af37; } 
        .btn-ring { border-bottom: 4px solid #007bff; } 
        .btn-little { border-bottom: 4px solid #ff00ff; } 

        .split-btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .split-sub-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 4px solid #ff00ff; 
            box-sizing: border-box;
        }

        .consonant-btn:active, .split-sub-btn:active {
            background: #55556b !important;
            transform: scale(0.98);
        }

        .btn-label { font-size: 18px; }
        .btn-sub { font-size: 10px; color: #aaa; margin-top: 2px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="left-panel">
        <button id="playBtn" disabled>⏳ 全WAVを解析中...</button>
        <div class="pad-container">
            <canvas id="vowelPad"></canvas>
        </div>
    </div>

    <div class="right-panel-container">
        <div class="right-panel">
            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="z"><span class="btn-label">Z</span><span class="btn-sub">ざ行</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="g"><span class="btn-label">G</span><span class="btn-sub">が行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="d"><span class="btn-label">D</span><span class="btn-sub">だ行</span></div>
                <div class="split-btn-container">
                    <div class="split-sub-btn playable-key" data-consonant="b"><span class="btn-label" style="font-size:15px;">B</span><span class="btn-sub" style="font-size:8px;">ば</span></div>
                    <div class="split-sub-btn playable-key" data-consonant="p"><span class="btn-label" style="font-size:15px;">P</span><span class="btn-sub" style="font-size:8px;">ぱ</span></div>
                </div>
            </div>

            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="s"><span class="btn-label">S</span><span class="btn-sub">さ行</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="k"><span class="btn-label">K</span><span class="btn-sub">か行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="t"><span class="btn-label">T</span><span class="btn-sub">た行</span></div>
                <div class="consonant-btn btn-little playable-key" data-consonant="h"><span class="btn-label">H</span><span class="btn-sub">は行</span></div>
            </div>

            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="n"><span class="btn-label">N</span><span class="btn-sub">な・ん</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="m"><span class="btn-label">M</span><span class="btn-sub">ま行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="r"><span class="btn-label">R</span><span class="btn-sub">ら行</span></div>
                <div class="consonant-btn btn-little playable-key" data-consonant="vowel_trigger"><span class="btn-label">V</span><span class="btn-sub">母音トリガ</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    let audioCtx = null;
    let mainGain = null;
    let vowelGainNode = null;   
    let consonantGainNode = null; 
    let isPlaying = false;

    let baseVowelVolume = 0.90; 
    const VOWEL_DURATION = 0.9; // 🌟 母音の限定発声長さを「0.9秒」へ変更！

    const vowels = [
        { label: 'I', x: 0.23, y: 0.25, r: 0.23, file: 'mother/i.wav', rawBuffer: null, color: 'rgba(0, 200, 0, 0.15)', border: '#00cc00', isVowel: true }, 
        { label: 'E', x: 0.55, y: 0.21, r: 0.18, file: 'mother/e.wav', rawBuffer: null, color: 'rgba(255, 230, 0, 0.25)', border: '#d4af37', isVowel: true }, 
        { label: 'A', x: 0.78, y: 0.54, r: 0.22, file: 'mother/a.wav', rawBuffer: null, color: 'rgba(255, 0, 0, 0.15)', border: '#ff0000', isVowel: true }, 
        { label: 'U', x: 0.18, y: 0.67, r: 0.18, file: 'mother/u.wav', rawBuffer: null, color: 'rgba(0, 0, 255, 0.15)', border: '#0000ff', isVowel: true }, 
        { label: 'O', x: 0.46, y: 0.80, r: 0.23, file: 'mother/o.wav', rawBuffer: null, color: 'rgba(255, 0, 255, 0.15)', border: '#ff00ff', isVowel: true },
        { label: 'NN', x: 0.45, y: 0.50, r: 0.12, file: 'mother/nn.wav', rawBuffer: null, color: 'rgba(255, 255, 255, 0.1)', border: '#ffffff', isVowel: false } 
    ];

    const consonantBuffers = {
        'k': {}, 's': {}, 't': {}, 'h': {}, 'b': {}, 'p': {},
        'd': {}, 'g': {}, 'z': {}, 'n': {}, 'm': {}, 'r': {}
    };

    let currentX = 0.5;
    let currentY = 0.5;
    let isVowelTouching = false; 
    let activeVowelTouchId = null; 

    const playBtn = document.getElementById('playBtn');
    const padCanvas = document.getElementById('vowelPad');
    const padCtx = padCanvas.getContext('2d');

    async function loadAndAnalyzeAllWAVs() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        mainGain = audioCtx.createGain();
        mainGain.gain.value = 0.6;
        mainGain.connect(audioCtx.destination);

        vowelGainNode = audioCtx.createGain();
        vowelGainNode.gain.value = baseVowelVolume;
        vowelGainNode.connect(mainGain);

        consonantGainNode = audioCtx.createGain();
        consonantGainNode.gain.value = 1.8; 
        consonantGainNode.connect(mainGain);

        const loadPromises = [];

        vowels.forEach(v => {
            loadPromises.push((async () => {
                try {
                    const res = await fetch(v.file);
                    const arrayBuf = await res.arrayBuffer();
                    v.rawBuffer = await audioCtx.decodeAudioData(arrayBuf);
                } catch(e) { console.error(`オーディオロード失敗: ${v.file}`); }
            })());
        });

        const vLabels = ['a', 'i', 'u', 'e', 'o'];
        const cKeys = Object.keys(consonantBuffers);
        cKeys.forEach(c => {
            vLabels.forEach(v => {
                const filePath = `${c}/${c}${v}.wav`; 
                const upperV = v.toUpperCase();
                loadPromises.push((async () => {
                    try {
                        const res = await fetch(filePath);
                        const arrayBuf = await res.arrayBuffer();
                        consonantBuffers[c][upperV] = await audioCtx.decodeAudioData(arrayBuf);
                    } catch(e) { console.warn(`子音WAV不在: ${filePath}`); }
                })());
            });
        });

        try {
            await Promise.all(loadPromises);
            playBtn.disabled = false;
            playBtn.textContent = '🔒 タッチしてボード有効化';
            resizePad();
        } catch(e) {
            playBtn.textContent = '⚠️ ロードエラー';
        }
    }

    // 🌟 コアロジック：ブレンド母音のワンショット生成・再生（0.9秒クリップ）
    function generateAndPlayVowelBuffer() {
        // 1. 各母音のブレンド比率を計算
        const nnTarget = vowels.find(v => v.label === 'NN');
        const dxNN = currentX - nnTarget.x;
        const dyNN = currentY - nnTarget.y;
        const distNN = Math.sqrt(dxNN*dxNN + dyNN*dyNN);

        // もし現在地が「ん」サークルの内側なら混ざり気なしのnn.wavを選択
        if (distNN <= nnTarget.r && nnTarget.rawBuffer) {
            playSingleBufferOneShot(nnTarget.rawBuffer);
            return;
        }

        // 大円エリアの5母音モーフィングブレンド
        const pureVowels = vowels.filter(v => v.isVowel); 
        let totalWeight = 0;
        let weights = [];
        pureVowels.forEach(v => {
            const dx = currentX - v.x;
            const dy = currentY - v.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            const weight = distance === 0 ? 999999 : 1 / Math.pow(distance, 2);
            weights.push(weight);
            totalWeight += weight;
        });
        const normalizedWeights = weights.map(w => w / totalWeight);

        const sampleRate = audioCtx.sampleRate;
        const totalSamples = Math.floor(sampleRate * VOWEL_DURATION); 

        const oneShotBuffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
        const channelData = oneShotBuffer.getChannelData(0);

        for (let i = 0; i < totalSamples; i++) {
            let blendedSample = 0;
            for (let j = 0; j < pureVowels.length; j++) {
                const vBuf = pureVowels[j].rawBuffer;
                if (vBuf && vBuf.getChannelData(0)[i] !== undefined) {
                    blendedSample += vBuf.getChannelData(0)[i] * normalizedWeights[j];
                }
            }
            // 末尾30msにフェードアウト
            if (i > totalSamples - Math.floor(sampleRate * 0.03)) {
                const fadeProgress = (totalSamples - i) / Math.floor(sampleRate * 0.03);
                blendedSample *= fadeProgress;
            }
            channelData[i] = blendedSample;
        }

        playSingleBufferOneShot(oneShotBuffer);
    }

    function playSingleBufferOneShot(buffer) {
        const sampleRate = audioCtx.sampleRate;
        const totalSamples = Math.floor(sampleRate * VOWEL_DURATION);

        const clipBuffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
        const outData = clipBuffer.getChannelData(0);
        const inData = buffer.getChannelData(0);

        for(let i=0; i<totalSamples; i++) {
            if (inData[i] !== undefined) {
                let s = inData[i];
                if (i > totalSamples - Math.floor(sampleRate * 0.03)) {
                    s *= (totalSamples - i) / Math.floor(sampleRate * 0.03);
                }
                outData[i] = s;
            }
        }

        const source = audioCtx.createBufferSource();
        source.buffer = clipBuffer;
        source.connect(vowelGainNode);
        source.start(0);
    }

    // 各種ボタン判定
    function triggerConsonant(consonantKey) {
        if (!audioCtx || !isPlaying) return;

        // 🌟 右手小指下段の新しい「V（母音トリガー）」キーが叩かれたときの処理
        if (consonantKey === 'vowel_trigger') {
            generateAndPlayVowelBuffer(); // 今の左手の座標の母音を0.9秒一発再生！
            console.log("右手打鍵による母音トリガー発動 🌟 (0.9秒)");
            return;
        }

        // Nボタン単打時の「ん」発声判定
        if (consonantKey === 'n' && !isVowelTouching) {
            const buffer = consonantBuffers['n']['A']; 
            if (!buffer) return;
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(consonantGainNode);
            source.start(0);
            return;
        }

        if (!consonantBuffers[consonantKey]) return;

        const pureVowels = vowels.filter(v => v.isVowel);
        let totalWeight = 0, maxWeight = -1, targetVowel = 'A';
        pureVowels.forEach(v => {
            const distance = Math.sqrt(Math.pow(currentX - v.x, 2) + Math.pow(currentY - v.y, 2));
            const weight = distance === 0 ? 999999 : 1 / Math.pow(distance, 2);
            totalWeight += weight;
            if (weight > maxWeight) { maxWeight = weight; targetVowel = v.label; }
        });

        const buffer = consonantBuffers[consonantKey][targetVowel];
        if (!buffer) return;

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(consonantGainNode); 
        source.start(0);
    }

    // --- UI・入力制御 ---
    function resizePad() {
        padCanvas.width = padCanvas.clientWidth;
        padCanvas.height = padCanvas.clientHeight;
        drawPad();
    }
    window.addEventListener('resize', resizePad);

    function drawPad() {
        const w = padCanvas.width, h = padCanvas.height;
        padCtx.clearRect(0, 0, w, h);

        vowels.forEach(v => {
            const cx = v.x * w, cy = v.y * h, radius = v.r * w;
            padCtx.fillStyle = v.color;
            padCtx.strokeStyle = v.border;
            padCtx.lineWidth = v.isVowel ? 1.5 : 2.5; 
            padCtx.beginPath();
            padCtx.arc(cx, cy, radius, 0, 2 * Math.PI);
            padCtx.fill();
            padCtx.stroke();

            padCtx.fillStyle = '#fff';
            padCtx.font = v.isVowel ? 'bold 14px sans-serif' : 'bold 11px sans-serif'; 
            padCtx.textAlign = 'center';
            padCtx.textBaseline = 'middle';
            padCtx.fillText(v.label, cx, cy);
        });

        const px = currentX * w, py = currentY * h;
        padCtx.strokeStyle = '#fff'; padCtx.lineWidth = 2;
        padCtx.beginPath(); padCtx.arc(px, py, 6, 0, 2 * Math.PI);
        padCtx.fillStyle = isVowelTouching ? '#007bff' : 'rgba(255,255,255,0.2)';
        padCtx.fill(); padCtx.stroke();
    }

    function updateVowelCoords(touchOrEvent) {
        const rect = padCanvas.getBoundingClientRect();
        currentX = Math.max(0, Math.min(1, (touchOrEvent.clientX - rect.left) / rect.width));
        currentY = Math.max(0, Math.min(1, (touchOrEvent.clientY - rect.top) / rect.height));
    }

    function setupInputEvents() {
        // PC
        padCanvas.addEventListener('mousedown', (e) => {
            isVowelTouching = true;
            updateVowelCoords(e);
            drawPad();
            if (isPlaying) generateAndPlayVowelBuffer(); // 左手タッチ時も今まで通り0.9秒鳴ります
        });
        window.addEventListener('mousemove', (e) => {
            if (isVowelTouching && activeVowelTouchId === null) {
                updateVowelCoords(e);
                drawPad(); 
            }
        });
        window.addEventListener('mouseup', () => {
            if (activeVowelTouchId === null) {
                isVowelTouching = false;
                drawPad();
            }
        });

        // スマホ
        padCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isVowelTouching) {
                const touch = e.changedTouches[0];
                activeVowelTouchId = touch.identifier;
                isVowelTouching = true;
                updateVowelCoords(touch);
                drawPad();
                if (isPlaying) generateAndPlayVowelBuffer(); // 左手タッチ時も今まで通り0.9秒鳴ります
            }
        }, { passive: false });

        padCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isVowelTouching && activeVowelTouchId !== null) {
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === activeVowelTouchId) {
                        updateVowelCoords(e.touches[i]);
                        drawPad();
                        break;
                    }
                }
            }
        }, { passive: false });

        const handleTouchEnd = (e) => {
            if (isVowelTouching && activeVowelTouchId !== null) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeVowelTouchId) {
                        isVowelTouching = false;
                        activeVowelTouchId = null;
                        drawPad();
                        break;
                    }
                }
            }
        };
        padCanvas.addEventListener('touchend', handleTouchEnd);
        padCanvas.addEventListener('touchcancel', handleTouchEnd);

        // 子音＆新母音トリガーボタン
        const buttonTrigger = (el) => {
            const cKey = el.getAttribute('data-consonant');
            if (cKey) triggerConsonant(cKey);
        };

        document.querySelectorAll('.consonant-btn, .split-sub-btn').forEach(btn => {
            btn.addEventListener('mousedown', (e) => buttonTrigger(e.currentTarget));
            btn.addEventListener('touchstart', (e) => { 
                e.preventDefault();
                buttonTrigger(e.currentTarget); 
            }, { passive: false });
        });
    }

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = true;
            playBtn.textContent = '🔊 フル機能サンプラー（0.9秒）稼働中';
            playBtn.classList.add('playing');
        } else {
            audioCtx.suspend();
            isPlaying = false;
            playBtn.textContent = '🔒 タッチして有効化';
            playBtn.classList.remove('playing');
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        loadAndAnalyzeAllWAVs();
        setupInputEvents();
    });
</script>
</body>
</html>
