<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人力音声合成・横型トレーニングボード（調音結合版）</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1e1e24; 
            color: #fff;
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-container {
            display: grid;
            grid-template-columns: 30% 70%; 
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* ================= 左側：母音エリア ================= */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            border-right: 2px solid #2a2a35;
            background: #15151a;
        }

        .system-btn {
            width: 90%;
            padding: 8px;
            font-size: 11px;
            font-weight: bold;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            margin-bottom: auto; 
            cursor: pointer;
        }
        .system-btn.playing { background: #dc3545; }
        .system-btn:disabled { background: #555; cursor: not-allowed; }

        .pad-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 180px; 
            margin-bottom: 5px;
        }
        #vowelPad {
            background: #22222b;
            border: 2px solid #444;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* ================= 右側：子音ボードエリア ================= */
        .right-panel {
            display: grid;
            grid-template-rows: repeat(3, 1fr); 
            gap: 8px;
            padding: 12px;
            box-sizing: border-box;
            background: #1e1e24;
        }

        .button-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px;
        }

        .consonant-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            transition: background 0.05s;
        }
        
        /* 音が出る実機能キーにうっすら目印（枠線を少し明るく） */
        .playable-key {
            border: 1px solid #00ffcc !important;
        }
        
        .btn-index { border-bottom: 4px solid #00cc00; } 
        .btn-middle { border-bottom: 4px solid #d4af37; } 
        .btn-ring { border-bottom: 4px solid #007bff; } 
        .btn-little { border-bottom: 4px solid #ff00ff; } 

        .split-btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .split-sub-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 4px solid #ff00ff; 
        }

        .consonant-btn:active, .split-sub-btn:active {
            background: #55556b !important;
            transform: scale(0.98);
        }

        .btn-label { font-size: 18px; }
        .btn-sub { font-size: 10px; color: #aaa; margin-top: 2px; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="left-panel">
        <button id="playBtn" class="system-btn">⏳ WAV読み込み中...</button>
        <div class="pad-container">
            <canvas id="vowelPad"></canvas>
        </div>
    </div>

    <div class="right-panel">
        
        <!-- 上段：z, g, d, b/p -->
        <div class="button-row">
            <div class="consonant-btn btn-index" data-consonant="z"><span class="btn-label">Z</span><span class="btn-sub">ざ行</span></div>
            <div class="consonant-btn btn-middle" data-consonant="g"><span class="btn-label">G</span><span class="btn-sub">が行</span></div>
            <div class="consonant-btn btn-ring" data-consonant="d"><span class="btn-label">D</span><span class="btn-sub">だ行</span></div>
            <div class="split-btn-container">
                <div class="split-sub-btn" data-consonant="b"><span class="btn-label" style="font-size:15px;">B</span><span class="btn-sub" style="font-size:8px;">ば</span></div>
                <div class="split-sub-btn" data-consonant="p"><span class="btn-label" style="font-size:15px;">P</span><span class="btn-sub" style="font-size:8px;">ぱ</span></div>
            </div>
        </div>

        <!-- 中段：s, k, t, h (s, k, tのみ実音連動) -->
        <div class="button-row">
            <div class="consonant-btn btn-index playable-key" data-consonant="s"><span class="btn-label">S</span><span class="btn-sub">さ行</span></div>
            <div class="consonant-btn btn-middle playable-key" data-consonant="k"><span class="btn-label">K</span><span class="btn-sub">か行</span></div>
            <div class="consonant-btn btn-ring playable-key" data-consonant="t"><span class="btn-label">T</span><span class="btn-sub">た行</span></div>
            <div class="consonant-btn btn-little" data-consonant="h"><span class="btn-label">H</span><span class="btn-sub">は行</span></div>
        </div>

        <!-- 下段：n, m, r, っ -->
        <div class="button-row">
            <div class="consonant-btn btn-index" data-consonant="n"><span class="btn-label">N</span><span class="btn-sub">な・ん</span></div>
            <div class="consonant-btn btn-middle" data-consonant="m"><span class="btn-label">M</span><span class="btn-sub">ま行</span></div>
            <div class="consonant-btn btn-ring" data-consonant="r"><span class="btn-label">R</span><span class="btn-sub">ら行</span></div>
            <div class="consonant-btn btn-little" data-consonant="tsu"><span class="btn-label">っ</span><span class="btn-sub">促音</span></div>
        </div>

    </div>
</div>

<script>
    let audioCtx = null;
    let mainGain = null;
    let isPlaying = false;

    // 15個の調音結合WAVを格納するバッファ
    const audioBuffers = {
        's': { 'A': null, 'I': null, 'U': null, 'E': null, 'O': null },
        't': { 'A': null, 'I': null, 'U': null, 'E': null, 'O': null },
        'k': { 'A': null, 'I': null, 'U': null, 'E': null, 'O': null }
    };

    // 母音の配置データ
    const vowels = [
        { label: 'I', x: 0.28, y: 0.33, r: 0.14, color: 'rgba(0, 200, 0, 0.15)', border: '#00cc00' }, 
        { label: 'E', x: 0.52, y: 0.32, r: 0.11, color: 'rgba(255, 230, 0, 0.25)', border: '#d4af37' }, 
        { label: 'A', x: 0.61, y: 0.56, r: 0.13, color: 'rgba(255, 0, 0, 0.15)', border: '#ff0000' }, 
        { label: 'U', x: 0.24, y: 0.60, r: 0.11, color: 'rgba(0, 0, 255, 0.15)', border: '#0000ff' }, 
        { label: 'O', x: 0.43, y: 0.77, r: 0.14, color: 'rgba(255, 0, 255, 0.15)', border: '#ff00ff' }  
    ];

    let currentX = 0.5;
    let currentY = 0.5;
    let isVowelTouching = false;

    const playBtn = document.getElementById('playBtn');
    const padCanvas = document.getElementById('vowelPad');
    const padCtx = padCanvas.getContext('2d');

    // 🌟 指定された3つのフォルダ（s, t, k）から15個のファイルを並列ロード
    async function initAudioAndLoadFiles() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain();
        mainGain.gain.value = 0.6; // 音量
        mainGain.connect(audioCtx.destination);

        const vLabels = ['a', 'i', 'u', 'e', 'o'];
        const targets = ['s', 't', 'k'];
        const loadPromises = [];

        targets.forEach(c => {
            vLabels.forEach(v => {
                const filePath = `${c}/${c}${v}.wav`; // 例: s/sa.wav
                const upperV = v.toUpperCase();       // 'A', 'I'...
                
                loadPromises.push((async () => {
                    try {
                        const res = await fetch(filePath);
                        if (!res.ok) throw new Error();
                        const arrayBuf = await res.arrayBuffer();
                        audioBuffers[c][upperV] = await audioCtx.decodeAudioData(arrayBuf);
                    } catch(e) {
                        console.error(`ファイルの読み込みに失敗しました: ${filePath}`);
                    }
                })());
            });
        });

        try {
            await Promise.all(loadPromises);
            playBtn.disabled = false;
            playBtn.textContent = '🔒 タッチしてボード有効化';
            resizePad();
        } catch (e) {
            playBtn.textContent = '⚠️ WAV読み込みエラー';
        }
    }

    // 🌟 コアロジック：今一番高いパーセントの母音を割り出し、対応するWAVを再生
    function triggerConsonant(consonantKey) {
        if (!audioCtx || !isPlaying) return;

        // s, k, t 以外はトレーニング用のモック（ログ出しのみ）
        if (!audioBuffers[consonantKey]) {
            console.log(`トレーニング打鍵 (音なし): ${consonantKey}`);
            return;
        }

        // 1. 各母音への距離から比率（パーセント）を計算
        let totalWeight = 0;
        let weights = [];
        const p = 2; 

        vowels.forEach(v => {
            const dx = currentX - v.x;
            const dy = currentY - v.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            const weight = distance === 0 ? 999999 : 1 / Math.pow(distance, p);
            weights.push({ label: v.label, weight: weight });
            totalWeight += weight;
        });

        // 2. 一番高いパーセント（ウエイト）の母音を1つ選択
        let maxWeight = -1;
        let highestVowelLabel = 'A'; // デフォルト

        weights.forEach(w => {
            const ratio = w.weight / totalWeight;
            if (ratio > maxWeight) {
                maxWeight = ratio;
                highestVowelLabel = w.label;
            }
        });

        // 3. 選択された「子音フォルダ + ターゲット母音」のWAVを選択して再生
        const buffer = audioBuffers[consonantKey][highestVowelLabel];
        if (buffer) {
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(mainGain);
            source.start(0);
            console.log(`発音 🌟 子音 [${consonantKey.toUpperCase()}] ➡️ 最寄りの母音 [${highestVowelLabel}] (${Math.round(maxWeight*100)}%)`);
        } else {
            console.warn(`バッファがありません: ${consonantKey}/${consonantKey}${highestVowelLabel.toLowerCase()}.wav`);
        }
    }

    // --- UI描画・イベント制御 ---
    function resizePad() {
        padCanvas.width = padCanvas.clientWidth;
        padCanvas.height = padCanvas.clientHeight;
        drawPad();
    }
    window.addEventListener('resize', resizePad);

    function drawPad() {
        const w = padCanvas.width;
        const h = padCanvas.height;
        padCtx.clearRect(0, 0, w, h);

        vowels.forEach(v => {
            const cx = v.x * w;
            const cy = v.y * h;
            const radius = v.r * w;

            padCtx.fillStyle = v.color;
            padCtx.strokeStyle = v.border;
            padCtx.lineWidth = 1.5;
            
            padCtx.beginPath();
            padCtx.arc(cx, cy, radius, 0, 2 * Math.PI);
            padCtx.fill();
            padCtx.stroke();

            padCtx.fillStyle = '#fff';
            padCtx.font = 'bold 12px sans-serif';
            padCtx.textAlign = 'center';
            padCtx.textBaseline = 'middle';
            padCtx.fillText(v.label, cx, cy);
        });

        const px = currentX * w;
        const py = currentY * h;
        padCtx.strokeStyle = '#fff';
        padCtx.lineWidth = 2;
        padCtx.beginPath();
        padCtx.arc(px, py, 6, 0, 2 * Math.PI);
        padCtx.fillStyle = isVowelTouching ? '#007bff' : 'rgba(255,255,255,0.2)';
        padCtx.fill();
        padCtx.stroke();
    }

    function handleVowelPointer(e) {
        const rect = padCanvas.getBoundingClientRect();
        currentX = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        currentY = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        drawPad();
    }

    function setupInputEvents() {
        const onVowelDown = (e) => { isVowelTouching = true; handleVowelPointer(e); };
        const onVowelMove = (e) => { if (isVowelTouching) handleVowelPointer(e); };
        const onVowelUp = () => { isVowelTouching = false; drawPad(); };

        padCanvas.addEventListener('mousedown', onVowelDown);
        window.addEventListener('mousemove', onVowelMove);
        window.addEventListener('mouseup', onVowelUp);
        padCanvas.addEventListener('touchstart', (e) => { onVowelDown(e.touches[0]); e.preventDefault(); });
        window.addEventListener('touchmove', (e) => { onVowelMove(e.touches[0]); }, { passive: false });
        window.addEventListener('touchend', onVowelUp);

        const buttonTrigger = (el) => {
            const cKey = el.getAttribute('data-consonant');
            if (cKey) triggerConsonant(cKey);
        };

        document.querySelectorAll('.consonant-btn, .split-sub-btn').forEach(btn => {
            btn.addEventListener('mousedown', (e) => buttonTrigger(e.currentTarget));
            btn.addEventListener('touchstart', (e) => { 
                buttonTrigger(e.currentTarget); 
                e.preventDefault(); 
            });
        });
    }

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = true;
            playBtn.textContent = '🔊 ボード稼働中（S, K, T 実音連動）';
            playBtn.classList.add('playing');
        } else {
            audioCtx.suspend();
            isPlaying = false;
            playBtn.textContent = '🔒 タッチしてボード有効化';
            playBtn.classList.remove('playing');
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        initAudioAndLoadFiles();
        setupInputEvents();
    });
</script>
</body>
</html>
