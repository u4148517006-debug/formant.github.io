<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間軸モーフィング・母音合成装置</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; padding: 15px; text-align: center; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; color: #333; margin-bottom: 5px; }
        .sub { font-size: 12px; color: #666; margin-bottom: 15px; }
        
        .pad-container { position: relative; width: 100%; max-width: 450px; margin: 0 auto; aspect-ratio: 1 / 1; }
        #vowelPad { background: #fafafa; border: 2px solid #ccc; border-radius: 8px; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
        
        #oscilloscope { background: #111; width: 100%; max-width: 450px; height: 100px; border-radius: 8px; margin-top: 15px; }
        
        .status-bar { display: flex; justify-content: space-around; max-width: 450px; margin: 10px auto; font-weight: bold; font-family: monospace; background: #eee; padding: 8px; border-radius: 6px; font-size: 13px; }
        
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 6px; margin-bottom: 15px; width: 100%; max-width: 450px; }
        button.playing { background: #dc3545; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .vowel-charts { display: flex; justify-content: space-between; max-width: 450px; margin: 20px auto 0 auto; }
        .vowel-charts div { text-align: center; width: 18%; }
        .vowel-charts canvas { background: #222; width: 100%; height: 60px; border-radius: 4px; border: 1px solid #ddd; }
        .vowel-charts p { margin: 3px 0 0 0; font-weight: bold; font-size: 11px; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>1周期波形モーフィング・タッチシンセ</h1>
    <div class="sub">WAVから1周期を自動抽出して合成します</div>
    
    <button id="playBtn" disabled>⏳ WAVファイルを読み込み中...</button>

    <div class="pad-container">
        <canvas id="vowelPad"></canvas>
    </div>

    <div class="status-bar">
        <span id="blendRatio">WAVの解析をお待ちください...</span>
    </div>

    <canvas id="oscilloscope"></canvas>

    <div class="vowel-charts">
        <div><canvas id="chartA"></canvas><p>ア(A)</p></div>
        <div><canvas id="chartI"></canvas><p>イ(I)</p></div>
        <div><canvas id="chartU"></canvas><p>ウ(U)</p></div>
        <div><canvas id="chartE"></canvas><p>エ(E)</p></div>
        <div><canvas id="chartO"></canvas><p>オ(O)</p></div>
    </div>
</div>

<script>
    let audioCtx = null;
    let oscillator = null; // 今回は渡されたカスタム1周期波形をループ再生する役割
    let gainNode = null;
    let analyser = null;
    let isPlaying = false;

    let trailPoints = [];
    const MAX_TRAIL_LENGTH = 20;

    // 母音の設定（WAVファイル名とマッピング）
    const vowels = [
        { label: 'A', x: 0.60, y: 0.72, file: 'a.wav', rawPeriod: null, color: 'rgba(255, 0, 0, 0.15)', border: '#ff0000', canvasId: 'chartA' },
        { label: 'I', x: 0.07, y: 0.28, file: 'i.wav', rawPeriod: null, color: 'rgba(0, 200, 0, 0.15)', border: '#00cc00', canvasId: 'chartI' },
        { label: 'U', x: 0.12, y: 0.72, file: 'u.wav', rawPeriod: null, color: 'rgba(0, 0, 255, 0.15)', border: '#0000ff', canvasId: 'chartU' },
        { label: 'E', x: 0.25, y: 0.36, file: 'e.wav', rawPeriod: null, color: 'rgba(255, 230, 0, 0.25)', border: '#d4af37', canvasId: 'chartE' },
        { label: 'O', x: 0.25, y: 0.92, file: 'o.wav', rawPeriod: null, color: 'rgba(255, 0, 255, 0.15)', border: '#ff00ff', canvasId: 'chartO' }
    ];

    let currentX = 0.5;
    let currentY = 0.5;
    let isPointerDown = false;

    const playBtn = document.getElementById('playBtn');
    const padCanvas = document.getElementById('vowelPad');
    const padCtx = padCanvas.getContext('2d');
    const oscCanvas = document.getElementById('oscilloscope');
    const oscCtx = oscCanvas.getContext('2d');
    const blendRatioEl = document.getElementById('blendRatio');

    // 固定サイズで1周期波形をリサンプリングするためのバッファサイズ
    const PERIOD_SIZE = 512; 

    // 起動時にすべてのWAVを並列で読み込んで解析
    async function loadAndAnalyzeWAVs() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        try {
            const promises = vowels.map(async (v) => {
                const response = await fetch(v.file);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const channelData = audioBuffer.getChannelData(0); // モノラルとして1ch目を取得
                
                // 🌟 WAVの時間波形から自動で「1周期分」を検出して抽出
                v.rawPeriod = extractOnePeriod(channelData, audioBuffer.sampleRate);
                
                // 下部のミニCanvasに抽出した1周期波形を表示
                drawStaticWave(v.canvasId, v.rawPeriod, v.border);
            });

            await Promise.all(promises);
            
            // 準備完了
            playBtn.disabled = false;
            playBtn.textContent = '🔒 タッチして音声を有効化';
            blendRatioEl.textContent = '準備完了！パッドをタッチしてね';
            resizeCanvases();
        } catch (e) {
            console.error(e);
            blendRatioEl.textContent = 'WAVファイルの読み込みに失敗しました。パスやファイル名を確認してください。';
        }
    }

    // 🌟 コアアルゴリズム：自己相関法による1周期の自動検出とリサンプリング
    function extractOnePeriod(vowelData, sampleRate) {
        const center = Math.floor(vowelData.length / 2);
        const searchRange = 1024; // 解析するサンプル幅
        const signal = vowelData.slice(center, center + searchRange);

        // 自己相関（Autocorrelation）を計算して声の周期（ピッチ）を見つける
        let r = new Float32Array(searchRange);
        for (let lag = 0; lag < searchRange; lag++) {
            let sum = 0;
            for (let n = 0; n < searchRange - lag; n++) {
                sum += signal[n] * signal[n + lag];
            }
            r[lag] = sum;
        }

        // 人間の声の現実的な周波数範囲（80Hz〜300Hz）に該当するサンプルラグの範囲
        const minLag = Math.floor(sampleRate / 300);
        const maxLag = Math.floor(sampleRate / 80);
        
        // その範囲内での自己相関の「最大のピーク」を探す
        let maxVal = -1;
        let periodSamples = 200; // デフォルト値のバックアップ
        for (let i = minLag; i <= maxLag; i++) {
            if (r[i] > maxVal && r[i] > r[i-1] && r[i] > r
