<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人力音声合成・実戦型モーフィングボード</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1e1e24; 
            color: #fff;
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 全体コンテナ（横型グリッド） */
        .app-container {
            display: grid;
            grid-template-columns: 30% 70%; /* 母音パッドを30%に拡大 */
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* ================= 左側：母音エリア（30%） ================= */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* 🌟 画面を横にしたときに上側に来るよう「上寄せ」に変更 */
            align-items: center;
            padding: 12px 10px;
            box-sizing: border-box;
            border-right: 2px solid #2a2a35;
            background: #15151a;
            gap: 15px;
        }

        .system-btn {
            width: 95%;
            padding: 10px;
            font-size: 11px;
            font-weight: bold;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .system-btn.playing { background: #dc3545; }
        .system-btn:disabled { background: #555; cursor: not-allowed; }

        /* 母音タッチパネル */
        .pad-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 210px; /* パッド自体を一回り大きく */
        }
        #vowelPad {
            background: #22222b;
            border: 2px solid #444;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* ================= 右側：子音ボードエリア（70%） ================= */
        .right-panel-container {
            display: flex;
            flex-direction: column;
            justify-content: center; /* 🌟 縦方向0.9倍にして上下に空白（マージン）を持たせる */
            height: 100%;
            background: #1e1e24;
            box-sizing: border-box;
        }

        .right-panel {
            display: grid;
            grid-template-rows: repeat(3, 1fr); 
            gap: 8px;
            padding: 0 12px;
            height: 90%; /* 🌟 縦方向に0.9倍 */
            box-sizing: border-box;
        }

        .button-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px;
        }

        .consonant-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            transition: background 0.05s;
        }
        
        .playable-key { border: 1px solid #00ffcc !important; }
        .btn-index { border-bottom: 4px solid #00cc00; } 
        .btn-middle { border-bottom: 4px solid #d4af37; } 
        .btn-ring { border-bottom: 4px solid #007bff; } 
        .btn-little { border-bottom: 4px solid #ff00ff; } 

        .split-btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .split-sub-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 4px solid #ff00ff; 
        }

        .consonant-btn:active, .split-sub-btn:active {
            background: #55556b !important;
            transform: scale(0.98);
        }

        .btn-label { font-size: 18px; }
        .btn-sub { font-size: 10px; color: #aaa; margin-top: 2px; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="left-panel">
        <button id="playBtn" class="system-btn">⏳ WAV読み込み中...</button>
        <div class="pad-container">
            <canvas id="vowelPad"></canvas>
        </div>
    </div>

    <div class="right-panel-container">
        <div class="right-panel">
            <div class="button-row">
                <div class="consonant-btn btn-index" data-consonant="z"><span class="btn-label">Z</span><span class="btn-sub">ざ行</span></div>
                <div class="consonant-btn btn-middle" data-consonant="g"><span class="btn-label">G</span><span class="btn-sub">が行</span></div>
                <div class="consonant-btn btn-ring" data-consonant="d"><span class="btn-label">D</span><span class="btn-sub">だ行</span></div>
                <div class="split-btn-container">
                    <div class="split-sub-btn" data-consonant="b"><span class="btn-label" style="font-size:15px;">B</span><span class="btn-sub" style="font-size:8px;">ば</span></div>
                    <div class="split-sub-btn" data-consonant="p"><span class="btn-label" style="font-size:15px;">P</span><span class="btn-sub" style="font-size:8px;">ぱ</span></div>
                </div>
            </div>

            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="s"><span class="btn-label">S</span><span class="btn-sub">さ行</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="k"><span class="btn-label">K</span><span class="btn-sub">か行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="t"><span class="btn-label">T</span><span class="btn-sub">た行</span></div>
                <div class="consonant-btn btn-little" data-consonant="h"><span class="btn-label">H</span><span class="btn-sub">は行</span></div>
            </div>

            <div class="button-row">
                <div class="consonant-btn btn-index" data-consonant="n"><span class="btn-label">N</span><span class="btn-sub">な・ん</span></div>
                <div class="consonant-btn btn-middle" data-consonant="m"><span class="btn-label">M</span><span class="btn-sub">ま行</span></div>
                <div class="consonant-btn btn-ring" data-consonant="r"><span class="btn-label">R</span><span class="btn-sub">ら行</span></div>
                <div class="consonant-btn btn-little" data-consonant="tsu"><span class="btn-label">っ</span><span class="btn-sub">促音</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    let audioCtx = null;
    let mainGain = null;
    let vowelOscillator = null; // 母音のループ常時再生用オシレータ
    let vowelGainNode = null;   // 母音の音量管理（子音割り込み時に一瞬下げる用）
    let isPlaying = false;

    const PERIOD_SIZE = 512; 

    // 母音データ（🌟 相対位置を保ったまま、各真円の半径比率 r を約1.3倍に拡大！）
    const vowels = [
        { label: 'I', x: 0.28, y: 0.33, r: 0.18, file: 'i.wav', rawPeriod: null, color: 'rgba(0, 200, 0, 0.15)', border: '#00cc00' }, 
        { label: 'E', x: 0.52, y: 0.32, r: 0.14, file: 'e.wav', rawPeriod: null, color: 'rgba(255, 230, 0, 0.25)', border: '#d4af37' }, 
        { label: 'A', x: 0.61, y: 0.56, r: 0.17, file: 'a.wav', rawPeriod: null, color: 'rgba(255, 0, 0, 0.15)', border: '#ff0000' }, 
        { label: 'U', x: 0.24, y: 0.60, r: 0.14, file: 'u.wav', rawPeriod: null, color: 'rgba(0, 0, 255, 0.15)', border: '#0000ff' }, 
        { label: 'O', x: 0.43, y: 0.77, r: 0.18, file: 'o.wav', rawPeriod: null, color: 'rgba(255, 0, 255, 0.15)', border: '#ff00ff' }  
    ];

    // 子音WAVバッファ
    const consonantBuffers = {
        's': { 'A': null, 'I': null, 'U': null, 'E': null, 'O': null },
        't': { 'A': null, 'I': null, 'U': null, 'E': null, 'O': null },
        'k': { 'A': null, 'I': null, 'U': null, 'E': null, 'O': null }
    };

    let currentX = 0.5;
    let currentY = 0.5;
    let isVowelTouching = false;

    const playBtn = document.getElementById('playBtn');
    const padCanvas = document.getElementById('vowelPad');
    const padCtx = padCanvas.getContext('2d');

    // 1. すべてのWAV（母音5つ ＋ 子音15音）を一括解析・ロード
    async function loadAndAnalyzeAllWAVs() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain();
        mainGain.gain.value = 0.5;
        mainGain.connect(audioCtx.destination);

        const loadPromises = [];

        // ① 母音の読み込みと1周期の自動抽出
        vowels.forEach(v => {
            loadPromises.push((async () => {
                try {
                    const res = await fetch(v.file);
                    const arrayBuf = await res.res.arrayBuffer ? await res.arrayBuffer() : await res.clone().arrayBuffer();
                    const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
                    v.rawPeriod = extractOnePeriod(audioBuf.getChannelData(0), audioBuf.sampleRate);
                } catch(e) { console.error(`母音WAVロード失敗: ${v.file}`); }
            })());
        });

        // ② 子音調音結合WAVのロード
        const vLabels = ['a', 'i', 'u', 'e', 'o'];
        const cKeys = ['s', 't', 'k'];
        cKeys.forEach(c => {
            vLabels.forEach(v => {
                const filePath = `${c}/${c}${v}.wav`;
                const upperV = v.toUpperCase();
                loadPromises.push((async () => {
                    try {
                        const res = await fetch(filePath);
                        const arrayBuf = await res.arrayBuffer();
                        consonantBuffers[c][upperV] = await audioCtx.decodeAudioData(arrayBuf);
                    } catch(e) { console.warn(`子音WAV不在: ${filePath}`); }
                })());
            });
        });

        try {
            await Promise.all(loadPromises);
            playBtn.disabled = false;
            playBtn.textContent = '🔒 タッチして有効化';
            resizePad();
        } catch(e) {
            playBtn.textContent = '⚠️ ロードエラー';
        }
    }

    // 自己相関法による1周期抽出アルゴリズム
    function extractOnePeriod(vowelData, sampleRate) {
        const center = Math.floor(vowelData.length / 2);
        const searchRange = 1024;
        const signal = vowelData.slice(center, center + searchRange);
        let r = new Float32Array(searchRange);
        for (let lag = 0; lag < searchRange; lag++) {
            let sum = 0;
            for (let n = 0; n < searchRange - lag; n++) { sum += signal[n] * signal[n + lag]; }
            r[lag] = sum;
        }
        const minLag = Math.floor(sampleRate / 300);
        const maxLag = Math.floor(sampleRate / 80);
        let maxVal = -1, periodSamples = 200;
        for (let i = minLag; i <= maxLag; i++) {
            if (r[i] > maxVal && r[i] > r[i-1] && r[i] > r[i+1]) { maxVal = r[i]; periodSamples = i; }
        }
        const rawSegment = signal.slice(0, periodSamples);
        let resampled = new Float32Array(PERIOD_SIZE);
        for (let i = 0; i < PERIOD_SIZE; i++) {
            const targetIdx = (i / PERIOD_SIZE) * (rawSegment.length - 1);
            const baseIdx = Math.floor(targetIdx);
            const frac = targetIdx - baseIdx;
            resampled[i] = (1 - frac) * rawSegment[baseIdx] + frac * (rawSegment[baseIdx + 1] || rawSegment[baseIdx]);
        }
        let avg = 0;
        for(let i=0; i<PERIOD_SIZE; i++) avg += resampled[i];
        avg /= PERIOD_SIZE;
        for(let i=0; i<PERIOD_SIZE; i++) resampled[i] -= avg;
        return resampled;
    }

    // 2. 音声合成グラフの初期化（母音ループ再生の開始）
    function initAudioGraph() {
        vowelOscillator = audioCtx.createOscillator();
        vowelOscillator.frequency.value = 130; // 固定基本ピッチ

        vowelGainNode = audioCtx.createGain();
        vowelGainNode.gain.value = 0.25; // 常時ループ音量

        vowelOscillator.connect(vowelGainNode);
        vowelGainNode.connect(mainGain);

        vowelOscillator.start();
        updateVowelSynthesis();
    }

    // 3. リアルタイムな母音ブレンド処理
    function updateVowelSynthesis() {
        if (!audioCtx || !vowelOscillator) return;

        let totalWeight = 0;
        let weights = [];
        vowels.forEach(v => {
            const dx = currentX - v.x;
            const dy = currentY - v.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            const weight = distance === 0 ? 999999 : 1 / Math.pow(distance, 2);
            weights.push(weight);
            totalWeight += weight;
        });

        let squareSum = 0;
        const normalizedWeights = weights.map(w => {
            const ratio = w / totalWeight;
            squareSum += ratio * ratio;
            return ratio;
        });

        // 分散（平方和）ベースの音量動的減衰（さっきの30%~100%補正）
        let volFactor = 0.3 + (squareSum - 0.2) * (0.7 / 0.8);
        volFactor = Math.max(0.3, Math.min(1.0, volFactor));
        vowelGainNode.gain.setTargetAtTime(0.25 * volFactor, audioCtx.currentTime, 0.02);

        // 5つの1周期時間波形をブレンド
        let blendedWave = new Float32Array(PERIOD_SIZE);
        for (let i = 0; i < PERIOD_SIZE; i++) {
            let sumSample = 0;
            for (let j = 0; j < vowels.length; j++) {
                if (vowels[j].rawPeriod) sumSample += vowels[j].rawPeriod[i] * normalizedWeights[j];
            }
            blendedWave[i] = sumSample;
        }

        // PeriodicWaveへの変換（位相維持）
        let real = new Float32Array(PERIOD_SIZE / 2 + 1);
        let imag = new Float32Array(PERIOD_SIZE / 2 + 1);
        for (let k = 0; k < real.length; k++) {
            let r_sum = 0, i_sum = 0;
            for (let n = 0; n < PERIOD_SIZE; n++) {
                const angle = (2 * Math.PI * k * n) / PERIOD_SIZE;
                r_sum += blendedWave[n] * Math.cos(angle);
                i_sum -= blendedWave[n] * Math.sin(angle);
            }
            real[k] = r_sum / PERIOD_SIZE;
            imag[k] = i_sum / PERIOD_SIZE;
        }

        const wave = audioCtx.createPeriodicWave(real, imag, {disableNormalization: false});
        vowelOscillator.setPeriodicWave(wave);
    }

    // 4. 🌟 子音ボタンが押されたときの「割り込み再生」処理
    function triggerConsonant(consonantKey) {
        if (!audioCtx || !isPlaying) return;

        // 「っ」の処理（母音を一瞬完全にミュートにする）
        if (consonantKey === 'tsu') {
            vowelGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            vowelGainNode.gain.setTargetAtTime(0.25, audioCtx.currentTime + 0.1, 0.02);
            return;
        }

        if (!consonantBuffers[consonantKey]) return;

        // 今現在一番比率が高い母音（最寄り）を算出
        let totalWeight = 0, maxWeight = -1, targetVowel = 'A';
        vowels.forEach(v => {
            const distance = Math.sqrt(Math.pow(currentX - v.x, 2) + Math.pow(currentY - v.y, 2));
            const weight = distance === 0 ? 999999 : 1 / Math.pow(distance, 2);
            totalWeight += weight;
            if (weight > maxWeight) { maxWeight = weight; targetVowel = v.label; }
        });

        const buffer = consonantBuffers[consonantKey][targetVowel];
        if (!buffer) return;

        // 🌟 割り込み演出：子音が鳴る一瞬（0.06秒）だけ持続母音の音量をグッと落とし、子音を引き立たせる
        vowelGainNode.gain.setValueAtTime(0.02, audioCtx.currentTime); 
        vowelGainNode.gain.setTargetAtTime(0.25, audioCtx.currentTime + 0.06, 0.03); // 子音の終わりに合わせてフェードイン

        // 子音ワンショット再生
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(mainGain);
        source.start(0);
    }

    // --- UI制御 ---
    function resizePad() {
        padCanvas.width = padCanvas.clientWidth;
        padCanvas.height = padCanvas.clientHeight;
        drawPad();
    }
    window.addEventListener('resize', resizePad);

    function drawPad() {
        const w = padCanvas.width, h = padCanvas.height;
        padCtx.clearRect(0, 0, w, h);

        vowels.forEach(v => {
            const cx = v.x * w, cy = v.y * h, radius = v.r * w;
            padCtx.fillStyle = v.color;
            padCtx.strokeStyle = v.border;
            padCtx.lineWidth = 1.5;
            padCtx.beginPath();
            padCtx.arc(cx, cy, radius, 0, 2 * Math.PI);
            padCtx.fill();
            padCtx.stroke();

            padCtx.fillStyle = '#fff';
            padCtx.font = 'bold 13px sans-serif';
            padCtx.textAlign = 'center';
            padCtx.textBaseline = 'middle';
            padCtx.fillText(v.label, cx, cy);
        });

        const px = currentX * w, py = currentY * h;
        padCtx.strokeStyle = '#fff'; padCtx.lineWidth = 2;
        padCtx.beginPath(); padCtx.arc(px, py, 6, 0, 2 * Math.PI);
        padCtx.fillStyle = isVowelTouching ? '#007bff' : 'rgba(255,255,255,0.2)';
        padCtx.fill(); padCtx.stroke();
    }

    function handleVowelPointer(e) {
        const rect = padCanvas.getBoundingClientRect();
        currentX = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        currentY = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        drawPad();
        if (isPlaying) updateVowelSynthesis();
    }

    function setupInputEvents() {
        const onVowelDown = (e) => { isVowelTouching = true; handleVowelPointer(e); };
        const onVowelMove = (e) => { if (isVowelTouching) handleVowelPointer(e); };
        const onVowelUp = () => { isVowelTouching = false; drawPad(); };

        padCanvas.addEventListener('mousedown', onVowelDown);
        window.addEventListener('mousemove', onVowelMove);
        window.addEventListener('mouseup', onVowelUp);
        padCanvas.addEventListener('touchstart', (e) => { onVowelDown(e.touches[0]); e.preventDefault(); });
        window.addEventListener('touchmove', (e) => { onVowelMove(e.touches[0]); }, { passive: false });
        window.addEventListener('touchend', onVowelUp);

        const buttonTrigger = (el) => {
            const cKey = el.getAttribute('data-consonant');
            if (cKey) triggerConsonant(cKey);
        };

        document.querySelectorAll('.consonant-btn, .split-sub-btn').forEach(btn => {
            btn.addEventListener('mousedown', (e) => buttonTrigger(e.currentTarget));
            btn.addEventListener('touchstart', (e) => { buttonTrigger(e.currentTarget); e.preventDefault(); });
        });
    }

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            initAudioGraph();
            isPlaying = true;
            playBtn.textContent = '🔊 モーフィングシンセ稼働中';
            playBtn.classList.add('playing');
        } else {
            audioCtx.suspend();
            isPlaying = false;
            playBtn.textContent = '🔒 タッチして有効化';
            playBtn.classList.remove('playing');
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        loadAndAnalyzeAllWAVs();
        setupInputEvents();
    });
</script>
</body>
</html>
