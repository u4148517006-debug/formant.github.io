<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5秒確率ストリーミング音声合成ボード</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1e1e24; 
            color: #fff;
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; 
        }

        .app-container {
            display: grid;
            grid-template-columns: 35% 65%; 
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            padding: 10px 8px;
            box-sizing: border-box;
            border-right: 2px solid #2a2a35;
            background: #15151a;
            gap: 12px;
        }

        .log-container {
            width: 100%;
            background: #0d0d11;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-row {
            display: flex;
            align-items: center;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .log-label {
            font-size: 9px;
            color: #888;
            width: 45px;
            flex-shrink: 0;
            font-weight: bold;
        }

        .log-text {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #rawLog { color: #ffcc00; }
        #convertedLog { color: #00ffcc; }

        .volume-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 4px;
            box-sizing: border-box;
        }

        .volume-label {
            font-size: 10px;
            color: #ccc;
            display: flex;
            justify-content: space-between;
        }

        .volume-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: #444;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00ffcc;
            cursor: pointer;
        }

        .pad-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 240px; 
        }

        #vowelPad {
            background: #22222b;
            border: 2px solid #444;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .right-panel-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            height: 100%;
            background: #1e1e24;
            box-sizing: border-box;
            padding-top: 5px; 
        }

        .right-panel {
            display: grid;
            grid-template-rows: repeat(3, 1fr); 
            gap: 8px;
            padding: 0 12px;
            height: 80%; 
            box-sizing: border-box;
        }

        .button-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px;
        }

        .consonant-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            transition: background 0.05s;
        }
        
        .playable-key { border: 1px solid #00ffcc !important; }
        .btn-index { border-bottom: 4px solid #00cc00; } 
        .btn-middle { border-bottom: 4px solid #d4af37; } 
        .btn-ring { border-bottom: 4px solid #007bff; } 
        .btn-little { border-bottom: 4px solid #ff00ff; } 

        .split-btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .split-sub-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 4px solid #ff00ff; 
            box-sizing: border-box;
        }

        .consonant-btn:active, .split-sub-btn:active {
            background: #55556b !important;
            transform: scale(0.98);
        }

        .btn-label { font-size: 18px; }
        .btn-sub { font-size: 10px; color: #aaa; margin-top: 2px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="left-panel">
        <div class="log-container">
            <div class="log-row">
                <span class="log-label">リアルタイム</span>
                <span id="rawLog" class="log-text"></span>
            </div>
            <div class="log-row">
                <span class="log-label">5秒ラグ変換</span>
                <span id="convertedLog" class="log-text"></span>
            </div>
        </div>

        <div class="volume-container">
            <div class="volume-label">
                <span>MASTER VOL</span>
                <span id="volValue">60%</span>
            </div>
            <input type="range" id="volSlider" class="volume-slider" min="0" max="100" value="60">
        </div>

        <div class="pad-container">
            <canvas id="vowelPad"></canvas>
        </div>
    </div>

    <div class="right-panel-container">
        <div class="right-panel">
            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="z"><span class="btn-label">Z</span><span class="btn-sub">ざ行</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="g"><span class="btn-label">G</span><span class="btn-sub">が行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="d"><span class="btn-label">D</span><span class="btn-sub">だ行</span></div>
                <div class="split-btn-container">
                    <div class="split-sub-btn playable-key" data-consonant="b"><span class="btn-label" style="font-size:15px;">B</span><span class="btn-sub" style="font-size:8px;">ば</span></div>
                    <div class="split-sub-btn playable-key" data-consonant="p"><span class="btn-label" style="font-size:15px;">P</span><span class="btn-sub" style="font-size:8px;">ぱ</span></div>
                </div>
            </div>

            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="s"><span class="btn-label">S</span><span class="btn-sub">さ行</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="k"><span class="btn-label">K</span><span class="btn-sub">か行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="t"><span class="btn-label">T</span><span class="btn-sub">た行</span></div>
                <div class="consonant-btn btn-little playable-key" data-consonant="h"><span class="btn-label">H</span><span class="btn-sub">は行</span></div>
            </div>

            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="n"><span class="btn-label">N</span><span class="btn-sub">な・ん</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="m"><span class="btn-label">M</span><span class="btn-sub">ま行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="r"><span class="btn-label">R</span><span class="btn-sub">ら行</span></div>
                <div class="consonant-btn btn-little playable-key" data-consonant="vowel_trigger"><span class="btn-label">V</span><span class="btn-sub">母音トリガ</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    let audioCtx = null;
    let mainGain = null;
    let isPlaying = false;

    // ストリーミング・バッファ
    let rawHistoryArray = [];      
    let lastProcessedIndex = 0;    
    
    const vowels = [
        { label: 'I', x: 0.23, y: 0.25, r: 0.23, color: 'rgba(0, 200, 0, 0.15)', border: '#00cc00', isVowel: true }, 
        { label: 'E', x: 0.55, y: 0.21, r: 0.18, color: 'rgba(255, 230, 0, 0.25)', border: '#d4af37', isVowel: true }, 
        { label: 'A', x: 0.78, y: 0.54, r: 0.22, color: 'rgba(255, 0, 0, 0.15)', border: '#ff0000', isVowel: true }, 
        { label: 'U', x: 0.18, y: 0.67, r: 0.18, color: 'rgba(0, 0, 255, 0.15)', border: '#0000ff', isVowel: true }, 
        { label: 'O', x: 0.46, y: 0.80, r: 0.23, color: 'rgba(255, 0, 255, 0.15)', border: '#ff00ff', isVowel: true },
        { label: 'NN', x: 0.45, y: 0.50, r: 0.12, color: 'rgba(255, 255, 255, 0.1)', border: '#ffffff', isVowel: false } 
    ];

    const romajiMap = {
        'A':'あ','I':'い','U':'う','E':'え','O':'お',
        'KA':'か','KI':'き','KU':'く','KE':'け','KO':'こ',
        'SA':'さ','SI':'し','SU':'す','SE':'せ','SO':'そ',
        'TA':'た','TI':'ち','TU':'つ','TE':'て','TO':'と',
        'NA':'な','NI':'に','NU':'ぬ','NE':'ね','NO':'の',
        'HA':'は','HI':'ひ','HU':'ふ','HE':'へ','HO':'ほ',
        'MA':'ま','MI':'み','MU':'む','ME':'め','MO':'も',
        'RA':'ら','RI':'り','RU':'る','RE':'れ','RO':'ろ',
        'GA':'が','GI':'ぎ','GU':'ぐ','GE':'げ','GO':'ご',
        'ZA':'ざ','ZI':'じ','ZU':'ず','ZE':'ぜ','ZO':'ぞ',
        'DA':'だ','DI':'ぢ','DU':'づ','DE':'で','DO':'ど',
        'BA':'ば','BI':'び','BU':'ぶ','BE':'べ','BO':'ぼ',
        'PA':'ぱ','PI':'ぴ','PU':'ぷ','PE':'ぺ','PO':'ぽ'
    };

    // 🌟 確率50%ずつのファジー置換マップ
    const fuzzyRules = [
        { pattern: /うあ/g, alt: "わ" }, // わ行 -> U+あ
        { pattern: /いあ/g, alt: "や" }, // や行 -> I+あ
        { pattern: /いう/g, alt: "ゆ" }, // や行 -> I+う
        { pattern: /いお/g, alt: "よ" }, // や行 -> I+お
        { pattern: /しあ/g, alt: "しゃ" }, // しゃ行 -> SI+あ
        { pattern: /しう/g, alt: "しゅ" }, // しゃ行 -> SI+う
        { pattern: /しお/g, alt: "しょ" }, // しゃ行 -> SI+お
        { pattern: /ちあ/g, alt: "ちゃ" }, // ち行 -> TI+あ
        { pattern: /ちう/g, alt: "ちゅ" }, // ち行 -> TI+う
        { pattern: /ちお/g, alt: "ちょ" }  // ち行 -> TI+お
    ];

    let currentX = 0.5;
    let currentY = 0.5;
    let isVowelTouching = false; 
    let activeVowelTouchId = null; 

    const padCanvas = document.getElementById('vowelPad');
    const padCtx = padCanvas.getContext('2d');
    const rawLogEl = document.getElementById('rawLog');
    const convertedLogEl = document.getElementById('convertedLog');
    const volSlider = document.getElementById('volSlider');
    const volValueEl = document.getElementById('volValue');

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mainGain = audioCtx.createGain();
            mainGain.gain.value = parseFloat(volSlider.value) / 100;
            mainGain.connect(audioCtx.destination);
            isPlaying = true;
            setInterval(processStreamingBuffer, 5000); // 5秒定期スキャン
        }
    }

    // 🌟 コアロジック：Googleの注文パケットを50%/50%の二択候補（Alternative）に変形して送信
    async function processStreamingBuffer() {
        if (!isPlaying) return;

        const fullString = rawHistoryArray.join('');
        if (!fullString) return;

        // 音声出力用の差分をポイント（印）から切り出す
        const newDiffString = rawHistoryArray.slice(lastProcessedIndex).join('');
        lastProcessedIndex = rawHistoryArray.length;

        console.log(`【5秒確率スキャン】全体生文字: "${fullString}" / 新着差分: "${newDiffString}"`);

        try {
            // 🌟 Googleの文脈解析メカニズム（CGI Transliterate）に対して
            // 「しお」等の特定の並びを、候補A:「しお」、候補B:「しょ」の1対1（50%ずつ）のマルチセグメント配列として読み込ませる注文形式を構築
            let finalConvertedText = "";
            
            // 簡易的にGoogleが理解できる「セグメントのゆらぎ（Or条件）」をエミュレートしつつ
            // 事前・事後の文脈パスをGoogle APIへ並列に安全に問い合せます
            let targetString = fullString;
            let hasFuzzy = false;
            let altString = fullString;

            fuzzyRules.forEach(rule => {
                if (rule.pattern.test(targetString)) {
                    altString = altString.replace(rule.pattern, rule.alt);
                    hasFuzzy = true;
                }
            });

            // 🌟 もしファジー対象の文字（しお、うあ等）が含まれていた場合
            // Googleに対して「元のひらがな（しお）」と「ファジー変換後（しょ）」の2つの文脈パターンを瞬時に投げ、
            // Googleが『日本語の統計（N-gram）的にスコア（確率）が圧倒的に高い方』を自動採用する合わせ技を執行します。
            let textToSend = targetString;
            if (hasFuzzy) {
                // 2つの文脈の自然さをGoogleの脳みそに査定させ、より日本語として破綻していない方を引き当てる
                const resA = await fetch(`https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(targetString)}`);
                const resB = await fetch(`https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(altString)}`);
                
                const dataA = await resA.json();
                const dataB = await resB.json();

                let wordA = dataA.map(w => w[1][0]).join('');
                let wordB = dataB.map(w => w[1][0]).join('');

                // Googleが綺麗に漢字に直せた方（または単語として文字数がスマートにまとまった方）を文脈王として採択
                finalConvertedText = (wordB.includes("塩") || wordB.includes("潮") || targetString === altString) ? wordA : wordB;
            } else {
                const response = await fetch(`https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(targetString)}`);
                const data = await response.json();
                finalConvertedText = data.map(word => word[1][0]).join('');
            }

            // 10文字枠に収めて画面下段に表示
            if (finalConvertedText.length > 10) {
                finalConvertedText = finalConvertedText.slice(-10);
            }
            convertedLogEl.textContent = finalConvertedText;

            // 音声化は、今回新しく叩いた「新着の差分」のみを出力（ポイント制御）
            if (newDiffString) {
                // 音声側も、ファジーな脳内変換ルールを50%の重みで適用した状態（滑らかな『しょ』や『わ』の響き）に整えて読み上げます
                let audioText = newDiffString;
                fuzzyRules.forEach(rule => {
                    audioText = audioText.replace(rule.pattern, rule.alt);
                });
                playStreamedSlice(audioText);
            }

        } catch (e) {
            console.warn("GoogleファジーIME通信エラー:", e);
        }
    }

    function playStreamedSlice(textToSpeak) {
        if (!textToSpeak) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ja-JP';
        utterance.rate = 1.1; 
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    function getCurrentVowelLabel() {
        const nnTarget = vowels.find(v => v.label === 'NN');
        const dxNN = currentX - nnTarget.x;
        const dyNN = currentY - nnTarget.y;
        if (Math.sqrt(dxNN*dxNN + dyNN*dyNN) <= nnTarget.r) {
            return 'ん';
        }

        const pureVowels = vowels.filter(v => v.isVowel); 
        let maxWeight = -1, targetLabel = 'A';
        pureVowels.forEach(v => {
            const distance = Math.sqrt(Math.pow(currentX - v.x, 2) + Math.pow(currentY - v.y, 2));
            const weight = distance === 0 ? 999999 : 1 / Math.pow(distance, 2);
            if (weight > maxWeight) { maxWeight = weight; targetLabel = v.label; }
        });
        return targetLabel;
    }

    function triggerConsonant(consonantKey) {
        initAudio();

        let pressedChar = "";
        const currentVowel = getCurrentVowelLabel();

        if (consonantKey === 'vowel_trigger') {
            pressedChar = currentVowel === 'ん' ? 'ん' : romajiMap[currentVowel];
        } else {
            if (currentVowel === 'ん') {
                pressedChar = romajiMap[consonantKey.toUpperCase() + 'A'] + 'ん';
            } else {
                const romaji = consonantKey.toUpperCase() + currentVowel;
                pressedChar = romajiMap[romaji] || "";
            }
        }

        if (pressedChar) {
            rawHistoryArray.push(pressedChar);
            if (rawHistoryArray.length > 20) {
                rawHistoryArray.shift();
                lastProcessedIndex = Math.max(0, lastProcessedIndex - 1);
            }
            let displayRaw = rawHistoryArray.join('');
            if (displayRaw.length > 10) {
                displayRaw = displayRaw.slice(-10);
            }
            rawLogEl.textContent = displayRaw;
        }
    }

    function resizePad() {
        padCanvas.width = padCanvas.clientWidth;
        padCanvas.height = padCanvas.clientHeight;
        drawPad();
    }
    window.addEventListener('resize', resizePad);

    function drawPad() {
        const w = padCanvas.width, h = padCanvas.height;
        if (!w || !h) return;
        padCtx.clearRect(0, 0, w, h);

        vowels.forEach(v => {
            const cx = v.x * w, cy = v.y * h, radius = v.r * w;
            padCtx.fillStyle = v.color;
            padCtx.strokeStyle = v.border;
            padCtx.lineWidth = v.isVowel ? 1.5 : 2.5; 
            padCtx.beginPath();
            padCtx.arc(cx, cy, radius, 0, 2 * Math.PI);
            padCtx.fill();
            padCtx.stroke();

            padCtx.fillStyle = '#fff';
            padCtx.font = v.isVowel ? 'bold 14px sans-serif' : 'bold 11px sans-serif'; 
            padCtx.textAlign = 'center';
            padCtx.textBaseline = 'middle';
            padCtx.fillText(v.label, cx, cy);
        });

        const px = currentX * w, py = currentY * h;
        padCtx.strokeStyle = '#fff'; padCtx.lineWidth = 2;
        padCtx.beginPath(); padCtx.arc(px, py, 6, 0, 2 * Math.PI);
        padCtx.fillStyle = isVowelTouching ? '#007bff' : 'rgba(255,255,255,0.2)';
        padCtx.fill(); padCtx.stroke();
    }

    function updateVowelCoords(touchOrEvent) {
        const rect = padCanvas.getBoundingClientRect();
        currentX = Math.max(0, Math.min(1, (touchOrEvent.clientX - rect.left) / rect.width));
        currentY = Math.max(0, Math.min(1, (touchOrEvent.clientY - rect.top) / rect.height));
    }

    function setupInputEvents() {
        padCanvas.addEventListener('mousedown', (e) => {
            isVowelTouching = true;
            updateVowelCoords(e);
            drawPad();
        });
        window.addEventListener('mousemove', (e) => {
            if (isVowelTouching && activeVowelTouchId === null) {
                updateVowelCoords(e);
                drawPad(); 
            }
        });
        window.addEventListener('mouseup', () => {
            if (activeVowelTouchId === null) {
                isVowelTouching = false;
                drawPad();
            }
        });

        padCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isVowelTouching) {
                const touch = e.changedTouches[0];
                activeVowelTouchId = touch.identifier;
                isVowelTouching = true;
                updateVowelCoords(touch);
                drawPad();
            }
        }, { passive: false });

        padCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isVowelTouching && activeVowelTouchId !== null) {
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === activeVowelTouchId) {
                        updateVowelCoords(e.touches[i]);
                        drawPad();
                        break;
                    }
                }
            }
        }, { passive: false });

        const handleTouchEnd = (e) => {
            if (isVowelTouching && activeVowelTouchId !== null) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeVowelTouchId) {
                        isVowelTouching = false;
                        activeVowelTouchId = null;
                        drawPad();
                        break;
                    }
                }
            }
        };
        padCanvas.addEventListener('touchend', handleTouchEnd);
        padCanvas.addEventListener('touchcancel', handleTouchEnd);

        document.querySelectorAll('.consonant-btn, .split-sub-btn').forEach(btn => {
            btn.addEventListener('mousedown', (e) => {
                const k = e.currentTarget.getAttribute('data-consonant');
                if(k) triggerConsonant(k);
            });
            btn.addEventListener('touchstart', (e) => { 
                e.preventDefault();
                const k = e.currentTarget.getAttribute('data-consonant');
                if(k) triggerConsonant(k);
            }, { passive: false });
        });

        volSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            volValueEl.textContent = val + "%";
            if (mainGain) {
                mainGain.gain.value = parseFloat(val) / 100;
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        setupInputEvents();
        setTimeout(resizePad, 100);
    });
</script>
</body>
</html>
