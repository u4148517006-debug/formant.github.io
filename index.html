<script>
    let audioCtx = null;
    let mainGain = null;
    let isPlaying = false;

    // ストリーミング・バッファ管理
    let inputHistory = []; 
    let rawString = "";    
    
    const vowels = [
        { label: 'I', x: 0.23, y: 0.25, r: 0.23, color: 'rgba(0, 200, 0, 0.15)', border: '#00cc00', isVowel: true }, 
        { label: 'E', x: 0.55, y: 0.21, r: 0.18, color: 'rgba(255, 230, 0, 0.25)', border: '#d4af37', isVowel: true }, 
        { label: 'A', x: 0.78, y: 0.54, r: 0.22, color: 'rgba(255, 0, 0, 0.15)', border: '#ff0000', isVowel: true }, 
        { label: 'U', x: 0.18, y: 0.67, r: 0.18, color: 'rgba(0, 0, 255, 0.15)', border: '#0000ff', isVowel: true }, 
        { label: 'O', x: 0.46, y: 0.80, r: 0.23, color: 'rgba(255, 0, 255, 0.15)', border: '#ff00ff', isVowel: true },
        { label: 'NN', x: 0.45, y: 0.50, r: 0.12, color: 'rgba(255, 255, 255, 0.1)', border: '#ffffff', isVowel: false } 
    ];

    const romajiMap = {
        'A':'あ','I':'い','U':'う','E':'え','O':'お',
        'KA':'か','KI':'き','KU':'く','KE':'け','KO':'こ',
        'SA':'さ','SI':'し','SU':'す','SE':'せ','SO':'そ',
        'TA':'た','TI':'ち','TU':'つ','TE':'て','TO':'と',
        'NA':'な','NI':'に','NU':'ぬ','NE':'ね','NO':'の',
        'HA':'は','HI':'ひ','HU':'ふ','HE':'へ','HO':'ほ',
        'MA':'ま','MI':'み','MU':'む','ME':'め','MO':'も',
        'RA':'ら','RI':'り','RU':'る','RE':'れ','RO':'ろ',
        'GA':'が','GI':'ぎ','GU':'ぐ','GE':'げ','GO':'ご',
        'ZA':'ざ','ZI':'じ','ZU':'ず','ZE':'ぜ','ZO':'ぞ',
        'DA':'だ','DI':'ぢ','DU':'づ','DE':'で','DO':'ど',
        'BA':'ば','BI':'び','BU':'ぶ','BE':'べ','BO':'ぼ',
        'PA':'ぱ','PI':'ぴ','PU':'ぷ','PE':'ぺ','PO':'ぽ'
    };

    let currentX = 0.5;
    let currentY = 0.5;
    let isVowelTouching = false; 
    let activeVowelTouchId = null; 

    const padCanvas = document.getElementById('vowelPad');
    const padCtx = padCanvas.getContext('2d');
    const rawLogEl = document.getElementById('rawLog');
    const convertedLogEl = document.getElementById('convertedLog');
    const volSlider = document.getElementById('volSlider');
    const volValueEl = document.getElementById('volValue');

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mainGain = audioCtx.createGain();
            mainGain.gain.value = parseFloat(volSlider.value) / 100;
            mainGain.connect(audioCtx.destination);
            isPlaying = true;
            
            setInterval(processStreamingBuffer, 5000); // 5秒定期スキャン
        }
    }

    async function processStreamingBuffer() {
        if (!isPlaying) return;

        const now = Date.now();
        inputHistory = inputHistory.filter(item => now - item.time <= 5000);

        const targetChars = inputHistory.filter(item => {
            const age = now - item.time;
            return age >= 2000 && age <= 5000; 
        });

        if (targetChars.length === 0) return;

        const targetString = targetChars.map(item => item.char).join('');
        const apiUrl = `https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(targetString)}`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("Network response was not ok");
            
            const data = await response.json();
            let convertedResult = data.map(word => word[1][0]).join('');

            if (convertedResult.length > 10) {
                convertedResult = "…" + convertedResult.slice(-9);
            }
            convertedLogEl.textContent = convertedResult;

            // 🌟 【大改造】変換された文字列を、そのまま音声出力関数へ引き渡す！
            playStreamedSlice(convertedResult);

        } catch (e) {
            console.warn("Google変換API通信エラー:", e);
        }
    }

    // 🌟 核心新機能：Googleの読み上げ機能（Web Speech TTS）を使って、文字をそのまま1秒間発声させる
    function playStreamedSlice(textToSpeak) {
        if (!textToSpeak || textToSpeak === "…") return;

        // ブラウザ標準の音声合成を発動（※Google Cloud TTSの本格連携の前に、スマホ単体で100%音が出る最善のルートを組み込みました）
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ja-JP'; // 日本語に設定
        utterance.rate = 1.1;     // 少し早口（流暢）にする
        utterance.pitch = 1.0;    // 声の高さ

        // 🌟 あなたの理想である「最新の約1秒分（適切な音節）」だけを流すためのトリミング制御
        // 再生が始まってから約1秒（1100ミリ秒）が経過した瞬間に、音声を強制的にフェードアウト気味にストップさせます
        setTimeout(() => {
            window.speechSynthesis.cancel(); // 1秒強でスパッと発声を終了して次のスキャンに備える
            console.log(`-> ストリーミング音声の1秒切り出し再生を完了: "${textToSpeak}"`);
        }, 1100);

        // 発声開始！
        window.speechSynthesis.speak(utterance);
    }

    function getCurrentVowelLabel() {
        const nnTarget = vowels.find(v => v.label === 'NN');
        const dxNN = currentX - nnTarget.x;
        const dyNN = currentY - nnTarget.y;
        if (Math.sqrt(dxNN*dxNN + dyNN*dyNN) <= nnTarget.r) {
            return 'ん';
        }

        const pureVowels = vowels.filter(v => v.isVowel); 
        let maxWeight = -1, targetLabel = 'A';
        pureVowels.forEach(v => {
            const distance = Math.sqrt(Math.pow(currentX - v.x, 2) + Math.pow(currentY - v.y, 2));
            const weight = distance === 0 ? 999999 : 1 / Math.pow(distance, 2);
            if (weight > maxWeight) { maxWeight = weight; targetLabel = v.label; }
        });
        return targetLabel;
    }

    function triggerConsonant(consonantKey) {
        initAudio();

        let pressedChar = "";
        const currentVowel = getCurrentVowelLabel();

        if (consonantKey === 'vowel_trigger') {
            pressedChar = currentVowel === 'ん' ? 'ん' : romajiMap[currentVowel];
        } else {
            if (currentVowel === 'ん') {
                pressedChar = romajiMap[consonantKey.toUpperCase() + 'A'] + 'ん';
            } else {
                const romaji = consonantKey.toUpperCase() + currentVowel;
                pressedChar = romajiMap[romaji] || "";
            }
        }

        if (pressedChar) {
            inputHistory.push({ char: pressedChar, time: Date.now() });

            rawString += pressedChar;
            if (rawString.length > 10) {
                rawString = rawString.slice(-10);
            }
            rawLogEl.textContent = rawString;
        }
    }

    // --- UI・描画系イベント（省略なし） ---
    function resizePad() {
        padCanvas.width = padCanvas.clientWidth;
        padCanvas.height = padCanvas.clientHeight;
        drawPad();
    }
    window.addEventListener('resize', resizePad);

    function drawPad() {
        const w = padCanvas.width, h = padCanvas.height;
        if (!w || !h) return;
        padCtx.clearRect(0, 0, w, h);

        vowels.forEach(v => {
            const cx = v.x * w, cy = v.y * h, radius = v.r * w;
            padCtx.fillStyle = v.color;
            padCtx.strokeStyle = v.border;
            padCtx.lineWidth = v.isVowel ? 1.5 : 2.5; 
            padCtx.beginPath();
            padCtx.arc(cx, cy, radius, 0, 2 * Math.PI);
            padCtx.fill();
            padCtx.stroke();

            padCtx.fillStyle = '#fff';
            padCtx.font = v.isVowel ? 'bold 14px sans-serif' : 'bold 11px sans-serif'; 
            padCtx.textAlign = 'center';
            padCtx.textBaseline = 'middle';
            padCtx.fillText(v.label, cx, cy);
        });

        const px = currentX * w, py = currentY * h;
        padCtx.strokeStyle = '#fff'; padCtx.lineWidth = 2;
        padCtx.beginPath(); padCtx.arc(px, py, 6, 0, 2 * Math.PI);
        padCtx.fillStyle = isVowelTouching ? '#007bff' : 'rgba(255,255,255,0.2)';
        padCtx.fill(); padCtx.stroke();
    }

    function updateVowelCoords(touchOrEvent) {
        const rect = padCanvas.getBoundingClientRect();
        currentX = Math.max(0, Math.min(1, (touchOrEvent.clientX - rect.left) / rect.width));
        currentY = Math.max(0, Math.min(1, (touchOrEvent.clientY - rect.top) / rect.height));
    }

    function setupInputEvents() {
        padCanvas.addEventListener('mousedown', (e) => {
            isVowelTouching = true;
            updateVowelCoords(e);
            drawPad();
        });
        window.addEventListener('mousemove', (e) => {
            if (isVowelTouching && activeVowelTouchId === null) {
                updateVowelCoords(e);
                drawPad(); 
            }
        });
        window.addEventListener('mouseup', () => {
            if (activeVowelTouchId === null) {
                isVowelTouching = false;
                drawPad();
            }
        });

        padCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isVowelTouching) {
                const touch = e.changedTouches[0];
                activeVowelTouchId = touch.identifier;
                isVowelTouching = true;
                updateVowelCoords(touch);
                drawPad();
            }
        }, { passive: false });

        padCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isVowelTouching && activeVowelTouchId !== null) {
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === activeVowelTouchId) {
                        updateVowelCoords(e.touches[i]);
                        drawPad();
                        break;
                    }
                }
            }
        }, { passive: false });

        const handleTouchEnd = (e) => {
            if (isVowelTouching && activeVowelTouchId !== null) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeVowelTouchId) {
                        isVowelTouching = false;
                        activeVowelTouchId = null;
                        drawPad();
                        break;
                    }
                }
            }
        };
        padCanvas.addEventListener('touchend', handleTouchEnd);
        padCanvas.addEventListener('touchcancel', handleTouchEnd);

        document.querySelectorAll('.consonant-btn, .split-sub-btn').forEach(btn => {
            btn.addEventListener('mousedown', (e) => {
                const k = e.currentTarget.getAttribute('data-consonant');
                if(k) triggerConsonant(k);
            });
            btn.addEventListener('touchstart', (e) => { 
                e.preventDefault();
                const k = e.currentTarget.getAttribute('data-consonant');
                if(k) triggerConsonant(k);
            }, { passive: false });
        });

        volSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            volValueEl.textContent = val + "%";
            if (mainGain) {
                mainGain.gain.value = parseFloat(val) / 100;
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        setupInputEvents();
        setTimeout(resizePad, 100);
    });
</script>
