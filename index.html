<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5秒タイマー連動型・音声合成ボード（トップヘッダー対称レイアウト＆空白母音版）</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1e1e24; 
            color: #fff;
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            height: 100vh;
            height: 100dvh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; 
            display: flex;
            flex-direction: column; 
        }

        /* 🌟 トップヘッダー：左にログ、右にスライダーを対称に配置 */
        .top-header {
            width: 100%;
            background: #15151a;
            border-bottom: 2px solid #2a2a35;
            padding: 8px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; 
        }

        /* 左側：文字列表示エリア */
        .top-left-logs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 48%;
        }

        .log-row {
            display: flex;
            align-items: center;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .log-label {
            font-size: 10px;
            color: #888;
            width: 75px;
            flex-shrink: 0;
            font-weight: bold;
        }

        .log-text {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #rawLog { color: #ffcc00; }
        #convertedLog { color: #00ffcc; }

        /* 右側：スライダーエリア */
        .top-right-sliders {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 48%;
        }

        .slider-row {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .slider-label {
            font-size: 10px;
            width: 75px;
            flex-shrink: 0;
            font-weight: bold;
        }

        .horizontal-slider {
            flex-grow: 1;
            margin: 0 10px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        .horizontal-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
        }

        .timer-slider::-webkit-slider-thumb { background: #00ffcc; box-shadow: 0 0 6px rgba(0, 255, 204, 0.6); }
        .vol-slider::-webkit-slider-thumb { background: #ff3366; box-shadow: 0 0 6px rgba(255, 51, 102, 0.6); }

        .slider-val {
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            width: 35px;
            text-align: right;
            flex-shrink: 0;
        }

        /* 🌟 メインの演奏領域（母音40%：子音60%に再設計） */
        .main-workspace {
            display: grid;
            grid-template-columns: 40% 60%; 
            width: 100%;
            flex-grow: 1; 
            min-height: 0; 
            box-sizing: border-box;
            overflow: hidden;
        }

        /* --- 左パネル（母音パネル） --- */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
            border-right: 1px solid #2a2a35;
            background: #15151a;
            height: 100%;
            overflow: hidden;
        }

        .pad-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #vowelPad {
            background: #22222b;
            border: 2px solid #444;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* --- 右パネル（子音ボタン） --- */
        .right-panel-container {
            display: flex;
            flex-direction: column;
            justify-content: center; 
            height: 100%;
            background: #1e1e24;
            box-sizing: border-box;
            padding: 8px; 
            overflow: hidden;
        }

        .right-panel {
            display: grid;
            grid-template-rows: repeat(3, 1fr); 
            gap: 6px;
            height: 96%;
            box-sizing: border-box;
        }

        .button-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 6px;
        }

        .consonant-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            transition: background 0.05s;
        }
        
        .playable-key { border: 1px solid #00ffcc !important; }
        .btn-index { border-bottom: 3px solid #00cc00; } 
        .btn-middle { border-bottom: 3px solid #d4af37; } 
        .btn-ring { border-bottom: 3px solid #007bff; } 
        .btn-little { border-bottom: 3px solid #ff00ff; } 

        .split-btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
        }
        .split-sub-btn {
            background: #2e2e3a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 3px solid #ff00ff; 
            box-sizing: border-box;
        }

        .consonant-btn:active, .split-sub-btn:active {
            background: #55556b !important;
            transform: scale(0.98);
        }

        .btn-label { font-size: 16px; }
        .btn-sub { font-size: 9px; color: #aaa; margin-top: 1px; }

        .bottom-spacer {
            height: 10vh;
            height: 10dvh;
            width: 100%;
            flex-shrink: 0;
            background: #1e1e24; 
        }
    </style>
</head>
<body>

<!-- 🌟 ヘッダー：左にログ、右にスライダーを対称配置 -->
<div class="top-header">
    <div class="top-left-logs">
        <div class="log-row">
            <span class="log-label">リアルタイム：</span>
            <span id="rawLog" class="log-text"></span>
        </div>
        <div class="log-row">
            <span class="log-label" id="convertedLogLabel">5.0秒変換：</span>
            <span id="convertedLog" class="log-text"></span>
        </div>
    </div>
    
    <div class="top-right-sliders">
        <div class="slider-row">
            <span class="slider-label" style="color: #00ffcc;">LAG TIMER</span>
            <input type="range" id="timerSlider" class="horizontal-slider timer-slider" min="0.5" max="5.0" step="0.5" value="5.0">
            <span class="slider-val" id="timerValue">5.0s</span>
        </div>
        <div class="slider-row">
            <span class="slider-label" style="color: #ff3366;">VOL BOOST</span>
            <input type="range" id="volSlider" class="horizontal-slider vol-slider" min="0" max="300" value="100">
            <span class="slider-val" id="volValue">100%</span>
        </div>
    </div>
</div>

<div class="main-workspace">
    <div class="left-panel">
        <div class="pad-container">
            <canvas id="vowelPad"></canvas>
        </div>
    </div>

    <div class="right-panel-container">
        <div class="right-panel">
            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="z"><span class="btn-label">Z</span><span class="btn-sub">ざ行</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="g"><span class="btn-label">G</span><span class="btn-sub">が行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="d"><span class="btn-label">D</span><span class="btn-sub">だ行</span></div>
                <div class="split-btn-container">
                    <div class="split-sub-btn playable-key" data-consonant="b"><span class="btn-label" style="font-size:13px;">B</span><span class="btn-sub" style="font-size:8px;">ば</span></div>
                    <div class="split-sub-btn playable-key" data-consonant="p"><span class="btn-label" style="font-size:13px;">P</span><span class="btn-sub" style="font-size:8px;">ぱ</span></div>
                </div>
            </div>

            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="s"><span class="btn-label">S</span><span class="btn-sub">さ行</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="k"><span class="btn-label">K</span><span class="btn-sub">か行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="t"><span class="btn-label">T</span><span class="btn-sub">た行</span></div>
                <div class="consonant-btn btn-little playable-key" data-consonant="h"><span class="btn-label">H</span><span class="btn-sub">は行</span></div>
            </div>

            <div class="button-row">
                <div class="consonant-btn btn-index playable-key" data-consonant="n"><span class="btn-label">N</span><span class="btn-sub">な/フリックん</span></div>
                <div class="consonant-btn btn-middle playable-key" data-consonant="m"><span class="btn-label">M</span><span class="btn-sub">ま行</span></div>
                <div class="consonant-btn btn-ring playable-key" data-consonant="r"><span class="btn-label">R</span><span class="btn-sub">ら行</span></div>
                <div class="consonant-btn btn-little playable-key" data-consonant="vowel_trigger"><span class="btn-label">V</span><span class="btn-sub">母音トリガ</span></div>
            </div>
        </div>
    </div>
</div>

<div class="bottom-spacer"></div>

<script>
    let audioCtx = null;
    let mainGain = null;
    let isPlaying = false;

    let rawHistoryArray = [];      
    let lastProcessedIndex = 0;    
    let activeTimerId = null;      
    
    let lastConsonantKey = null;
    let lastConsonantTime = 0;

    let touchStartVowelLabel = null;
    let flickCancelled = false;

    let currentTimerSeconds = 5.0;
    
    // 🌟 中央（元「ん」の座標）をポッカリ空けた、元のレイアウト座標に復元
    const vowels = [
        { label: 'I', x: 0.25, y: 0.26, r: 0.22, color: 'rgba(0, 200, 0, 0.15)', border: '#00cc00', isVowel: true }, 
        { label: 'E', x: 0.58, y: 0.23, r: 0.18, color: 'rgba(255, 230, 0, 0.25)', border: '#d4af37', isVowel: true }, 
        { label: 'A', x: 0.76, y: 0.54, r: 0.21, color: 'rgba(255, 0, 0, 0.15)', border: '#ff0000', isVowel: true }, 
        { label: 'U', x: 0.22, y: 0.67, r: 0.18, color: 'rgba(0, 0, 255, 0.15)', border: '#0000ff', isVowel: true }, 
        { label: 'O', x: 0.50, y: 0.78, r: 0.21, color: 'rgba(255, 0, 255, 0.15)', border: '#ff00ff', isVowel: true }
    ];

    const romajiMap = {
        'A':'あ','I':'い','U':'う','E':'え','O':'お',
        'KA':'か','KI':'き','KU':'く','KE':'け','KO':'こ',
        'SA':'さ','SI':'し','SU':'す','SE':'せ','SO':'そ',
        'TA':'た','TI':'ち','TU':'つ','TE':'て','TO':'と',
        'NA':'な','NI':'に','NU':'ぬ','NE':'ね','NO':'の',
        'HA':'は','HI':'ひ','HU':'ふ','HE':'へ','HO':'ほ',
        'MA':'ま','MI':'み','MU':'む','ME':'め','MO':'も',
        'RA':'ら','RI':'り','RU':'る','RE':'れ','RO':'ろ',
        'GA':'が','GI':'ぎ','GU':'ぐ','GE':'げ','GO':'ご',
        'ZA':'ざ','ZI':'じ','ZO':'ず','ZE':'ぜ','ZO':'ぞ',
        'DA':'だ','DI':'ぢ','DU':'づ','DE':'で','DO':'ど',
        'BA':'ば','BI':'び','BU':'ぶ','BE':'べ','BO':'ぼ',
        'PA':'ぱ','PI':'ぴ','PU':'ぷ','PE':'ぺ','PO':'ぽ'
    };

    const fuzzyRules = [
        { pattern: /しあ/g, alt: "しゃ" }, 
        { pattern: /しう/g, alt: "しゅ" }, 
        { pattern: /しお/g, alt: "しょ" }, 
        { pattern: /ちあ/g, alt: "ちゃ" }, 
        { pattern: /ちう/g, alt: "ちゅ" }, 
        { pattern: /ちお/g, alt: "ちょ" }  
    ];

    let currentX = 0.5;
    let currentY = 0.5;
    let isVowelTouching = false; 
    let activeVowelTouchId = null; 

    const padCanvas = document.getElementById('vowelPad');
    const padCtx = padCanvas.getContext('2d');
    const rawLogEl = document.getElementById('rawLog');
    const convertedLogEl = document.getElementById('convertedLog');
    const volSlider = document.getElementById('volSlider');
    const volValueEl = document.getElementById('volValue');
    
    const timerSlider = document.getElementById('timerSlider');
    const timerValueEl = document.getElementById('timerValue');
    const convertedLogLabel = document.getElementById('convertedLogLabel');

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mainGain = audioCtx.createGain();
            mainGain.gain.value = parseFloat(volSlider.value) / 100;
            mainGain.connect(audioCtx.destination);
            isPlaying = true;
        }
    }

    function startOnDemandTimer() {
        if (!isPlaying) return;
        if (activeTimerId !== null) return;
        
        const delayMs = currentTimerSeconds * 1000;
        activeTimerId = setTimeout(async () => {
            await processStreamingBuffer();
            activeTimerId = null;
        }, delayMs);
    }

    async function processStreamingBuffer() {
        const fullString = rawHistoryArray.join('');
        if (!fullString) return;

        const newDiffString = rawHistoryArray.slice(lastProcessedIndex).join('');
        lastProcessedIndex = rawHistoryArray.length;

        try {
            let finalConvertedText = "";
            let targetString = fullString;
            let hasFuzzy = false;
            let altString = fullString;

            fuzzyRules.forEach(rule => {
                if (rule.pattern.test(targetString)) {
                    altString = altString.replace(rule.pattern, rule.alt);
                    hasFuzzy = true;
                }
            });

            if (hasFuzzy) {
                const resA = await fetch(`https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(targetString)}`);
                const resB = await fetch(`https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(altString)}`);
                const dataA = await resA.json();
                const dataB = await resB.json();
                let wordA = dataA.map(w => w[1][0]).join('');
                let wordB = dataB.map(w => w[1][0]).join('');
                finalConvertedText = (wordB.includes("塩") || wordB.includes("潮") || targetString === altString) ? wordA : wordB;
            } else {
                const response = await fetch(`https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(targetString)}`);
                const data = await response.json();
                finalConvertedText = data.map(word => word[1][0]).join('');
            }

            if (finalConvertedText.length > 15) {
                finalConvertedText = finalConvertedText.slice(-15);
            }
            convertedLogEl.textContent = finalConvertedText;

            if (newDiffString) {
                let audioText = newDiffString;
                fuzzyRules.forEach(rule => {
                    audioText = audioText.replace(rule.pattern, rule.alt);
                });
                playStreamedSliceWithStretch(audioText);
            }

        } catch (e) {
            console.warn("GoogleファジーIME通信エラー:", e);
        }
    }

    function playStreamedSliceWithStretch(textToSpeak) {
        if (!textToSpeak) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ja-JP';
        const charCount = textToSpeak.length;
        
        let targetRate = (charCount * 0.28) / currentTimerSeconds;
        if (targetRate < 0.1) targetRate = 0.1;
        if (targetRate > 1.2) targetRate = 1.1; 
        
        utterance.rate = targetRate; 
        utterance.pitch = 0.95; 
        utterance.volume = Math.min(1.0, parseFloat(volSlider.value) / 100);
        window.speechSynthesis.speak(utterance);
    }

    function getClosestVowelLabelRaw() {
        let maxWeight = -1, targetLabel = 'A';
        vowels.forEach(v => {
            const distance = Math.sqrt(Math.pow(currentX - v.x, 2) + Math.pow(currentY - v.y, 2));
            const weight = distance === 0 ? 999999 : 1 / Math.pow(distance, 2);
            if (weight > maxWeight) { maxWeight = weight; targetLabel = v.label; }
        });
        return targetLabel;
    }

    function injectChar(char) {
        initAudio();
        startOnDemandTimer();
        rawHistoryArray.push(char);
        if (rawHistoryArray.length > 20) {
            rawHistoryArray.shift();
            lastProcessedIndex = Math.max(0, lastProcessedIndex - 1);
        }
        let displayRaw = rawHistoryArray.join('');
        if (displayRaw.length > 15) displayRaw = displayRaw.slice(-15);
        rawLogEl.textContent = displayRaw;
    }

    function triggerConsonant(consonantKey) {
        initAudio();
        startOnDemandTimer();
        flickCancelled = true;

        let now = Date.now();
        let isSokuon = false;

        if (consonantKey !== 'vowel_trigger' && consonantKey === lastConsonantKey && (now - lastConsonantTime) < 300) {
            isSokuon = true;
        }

        lastConsonantKey = consonantKey;
        lastConsonantTime = now;

        let pressedChar = "";
        const currentVowel = getClosestVowelLabelRaw();

        if (consonantKey === 'vowel_trigger') {
            pressedChar = romajiMap[currentVowel];
        } else {
            const romaji = consonantKey.toUpperCase() + currentVowel;
            pressedChar = romajiMap[romaji] || "";
        }

        if (pressedChar) {
            if (isSokuon && rawHistoryArray.length > 0) {
                rawHistoryArray.pop(); 
                rawHistoryArray.push('っ'); 
            }
            injectChar(pressedChar);
        }
    }

    function resizePad() {
        padCanvas.width = padCanvas.clientWidth;
        padCanvas.height = padCanvas.clientHeight;
        drawPad();
    }
    window.addEventListener('resize', resizePad);

    function drawPad() {
        const w = padCanvas.width, h = padCanvas.height;
        if (!w || !h) return;
        padCtx.clearRect(0, 0, w, h);
        const baseSize = Math.min(w, h);

        vowels.forEach(v => {
            const cx = v.x * w;
            const cy = v.y * h;
            const radius = v.r * baseSize * 0.9; 

            padCtx.fillStyle = v.color;
            padCtx.strokeStyle = v.border;
            padCtx.lineWidth = 2.5; 
            padCtx.beginPath();
            padCtx.arc(cx, cy, radius, 0, 2 * Math.PI);
            padCtx.fill();
            padCtx.stroke();

            padCtx.fillStyle = '#fff';
            padCtx.font = 'bold 16px sans-serif'; 
            padCtx.textAlign = 'center';
            padCtx.textBaseline = 'middle';
            padCtx.fillText(v.label, cx, cy);
        });

        const px = currentX * w, py = currentY * h;
        padCtx.strokeStyle = '#fff'; padCtx.lineWidth = 2;
        padCtx.beginPath(); padCtx.arc(px, py, 5, 0, 2 * Math.PI);
        padCtx.fillStyle = isVowelTouching ? '#007bff' : 'rgba(255,255,255,0.2)';
        padCtx.fill(); padCtx.stroke();
    }

    function updateVowelCoords(touchOrEvent) {
        const rect = padCanvas.getBoundingClientRect();
        currentX = Math.max(0, Math.min(1, (touchOrEvent.clientX - rect.left) / rect.width));
        currentY = Math.max(0, Math.min(1, (touchOrEvent.clientY - rect.top) / rect.height));
    }

    function handlePadStart(e) {
        isVowelTouching = true;
        flickCancelled = false; 
        updateVowelCoords(e);
        touchStartVowelLabel = getClosestVowelLabelRaw(); 
        drawPad();
    }

    function handlePadMove(e) {
        if (isVowelTouching) {
            updateVowelCoords(e);
            drawPad(); 
        }
    }

    function handlePadEnd() {
        isVowelTouching = false;
        let touchEndVowelLabel = getClosestVowelLabelRaw(); 

        if (!flickCancelled && touchStartVowelLabel && touchEndVowelLabel !== touchStartVowelLabel) {
            const combo = touchStartVowelLabel + '->' + touchEndVowelLabel;
            let flickChar = "";

            if (combo === 'U->A') flickChar = 'わ';
            else if (combo === 'U->O') flickChar = 'を';
            else if (combo === 'I->A') flickChar = 'や';
            else if (combo === 'I->U') flickChar = 'ゆ';
            else if (combo === 'I->O') flickChar = 'よ';

            if (flickChar) {
                injectChar(flickChar);
            }
        }
        
        touchStartVowelLabel = null;
        drawPad();
    }

    let consonantTouchStartY = 0;
    let activeConsonantTouchId = null;

    function setupInputEvents() {
        padCanvas.addEventListener('mousedown', handlePadStart);
        window.addEventListener('mousemove', handlePadMove);
        window.addEventListener('mouseup', () => {
            if (activeVowelTouchId === null && isVowelTouching) handlePadEnd();
        });

        padCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isVowelTouching) {
                const touch = e.changedTouches[0];
                activeVowelTouchId = touch.identifier;
                handlePadStart(touch);
            }
        }, { passive: false });

        padCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isVowelTouching && activeVowelTouchId !== null) {
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === activeVowelTouchId) {
                        handlePadMove(e.touches[i]);
                        break;
                    }
                }
            }
        }, { passive: false });

        const onTouchEnd = (e) => {
            if (isVowelTouching && activeVowelTouchId !== null) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeVowelTouchId) {
                        activeVowelTouchId = null;
                        handlePadEnd();
                        break;
                    }
                }
            }
        };
        padCanvas.addEventListener('touchend', onTouchEnd);
        padCanvas.addEventListener('touchcancel', onTouchEnd);

        document.querySelectorAll('.consonant-btn, .split-sub-btn').forEach(btn => {
            btn.addEventListener('mousedown', (e) => { 
                e.preventDefault(); 
                const k = btn.getAttribute('data-consonant'); 
                if(k) triggerConsonant(k); 
            });

            btn.addEventListener('touchstart', (e) => { 
                e.preventDefault();
                const touch = e.changedTouches[0];
                activeConsonantTouchId = touch.identifier;
                consonantTouchStartY = touch.clientY; 
            }, { passive: false });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (activeConsonantTouchId === null) return;

                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === activeConsonantTouchId) {
                        const touchEndY = touch.clientY;
                        const k = btn.getAttribute('data-consonant');
                        const distanceY = touchEndY - consonantTouchStartY;

                        if (k === 'n' && Math.abs(distanceY) > 15) {
                            injectChar("ん");
                        } else {
                            if (k) triggerConsonant(k);
                        }
                        activeConsonantTouchId = null;
                        break;
                    }
                }
            });
            
            btn.addEventListener('touchcancel', () => {
                activeConsonantTouchId = null;
            });
        });

        // 🌟 ボリュームとタイマーの横型スライダーイベント
        volSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            volValueEl.textContent = val + "%";
            if (mainGain) {
                mainGain.gain.value = parseFloat(val) / 100;
            }
        });

        timerSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            currentTimerSeconds = val;
            timerValueEl.textContent = val.toFixed(1) + "s";
            convertedLogLabel.textContent = val.toFixed(1) + "秒変換：";
            
            if (activeTimerId !== null) {
                clearTimeout(activeTimerId);
                activeTimerId = setTimeout(async () => {
                    await processStreamingBuffer();
                    activeTimerId = null;
                }, currentTimerSeconds * 1000);
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        setupInputEvents();
        setTimeout(resizePad, 150);
    });
</script>
</body>
</html>
